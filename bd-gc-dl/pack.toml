# BD GC DL — plugin-backed DoltLite build pack.
#
# This pack builds the split DoltLite shape:
#   - normal bd and gc binaries that speak to backend plugins
#   - bd-backend-doltlite for Beads storage
#   - gc-doltlite-fastpath for Gas City storage
#   - optional gc-doltlite helper and doltlite-client diagnostics
#
# It intentionally keeps direct libdoltlite linkage in the backend plugin
# binaries instead of in the main bd/gc CLIs.

[pack]
name = "bd-gc-dl"
schema = 2

[[backend_plugins]]
backend = "doltlite"
setup_hook = "assets/scripts/gc-bd-gc-dl-provider.sh"
provider_command = "assets/scripts/gc-bd-gc-dl-provider.sh"
prepare_command = ["build", "backend", "--install"]
store_path = ".beads/doltlite"
bd_compatibility = "bd-1.0.5"
capabilities = ["setup", "provider", "metadata", "fastpath", "store-health"]

[backend_plugins.scope]
model = "per_scope"
resource = "directory"
namespace_from = "prefix"
inherits_city_connection = true
metadata_owner = "plugin"
routes = "gc-prefix-routes"
adopt = "validate_or_repair"
remove = "preserve"

[backend_plugins.beads_endpoint]
command = ".gc/runtime/packs/bd-gc-dl/bin/bd-backend-doltlite"
args = ["serve"]
protocol = "beads.backend.v1alpha1"

[backend_plugins.gascity_endpoint]
command = ".gc/runtime/packs/bd-gc-dl/bin/gc-doltlite-fastpath"
args = ["serve"]
protocol = "gascity.backend.v1alpha1"
