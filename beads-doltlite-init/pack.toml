# Minimal DoltLite init support pack.
#
# This pack is intentionally small. In the DoltLite-enabled gc fork it is also
# bundled with the gc binary; publishing it here gives local cities a
# dereferenceable fork URL while the upstream PR is pending. It marks a city as
# having first-class DoltLite backend init support while the operational
# DoltLite tools live in the external gascity-packs/beads-doltlite pack.
[pack]
name = "beads-doltlite-init"
version = "0.1.0"
schema = 2
description = "Minimal builtin support for initializing DoltLite-backed Gas City bead stores."
