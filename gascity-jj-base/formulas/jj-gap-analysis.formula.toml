description = """
JJ document-workspace implementation of the report-only gap-analysis contract.

Use this when the reference behavior is an upstream implementation, approved
design, or generated audit context, and the subject is a jj source change that
must be checked against that reference before implementation continues.
"""
formula = "jj-gap-analysis"
version = 1
contract = "graph.v2"
extends = ["gap-analysis"]
target_required = false
mode = "report"

[catalog]
name = "jj-gap-analysis"
description = "Compare a jj source change to reference behavior and write a tracked gap-analysis report."

[vars]
[vars.docs_workspace]
description = "JJ workspace name that owns workflow documents."
default = "default"

[vars.docs_workspace_path]
description = "Absolute path to the default@ checkout used for workflow documents."
default = ""

[vars.manifest_path]
description = "Path to the workflow document manifest."
default = ""

[vars.context_path]
description = "Optional context bundle path containing upstream/design/reference notes."
default = ""

[vars.subject_path]
description = "Implementation summary, diff, source path, or artifact path to audit."
required = true

[vars.report_path]
description = "Path to write the gap-analysis report."
required = true

[vars.source_workspace]
description = "JJ workspace used for source implementation work."
default = ""

[vars.source_workspace_path]
description = "Absolute path to the jj source workspace being audited."
default = ""

[vars.source_change_id]
description = "JJ change ID containing the latest source implementation state."
default = ""

[[steps]]
id = "validate-context"
title = "Validate jj gap-analysis context"
metadata = { "gc.run_target" = "gc.run-operator", "gc.docs.managed" = "true", "gc.docs.workspace_key" = "gc.docs.workspace,gc.var.docs_workspace", "gc.docs.workspace_path_key" = "gc.docs.workspace_path,gc.var.docs_workspace_path", "gc.docs.manifest_path_keys" = "gc.docs.manifest_path,gc.var.manifest_path", "gc.docs.source_change_id_key" = "gc.docs.source_change_id,gc.var.source_change_id" }
description_file = "../assets/workflows/jj-docs/validate-gap-analysis-context.md"

[[steps]]
id = "describe-gap-analysis-change"
title = "Describe gap-analysis document change"
needs = ["validate-context"]
metadata = { "gc.run_target" = "gc.gap-analyst", "gc.jj.describe" = "true", "gc.jj.describe_scope" = "document", "gc.jj.describe_document" = "gap-analysis", "gc.docs.managed" = "true", "gc.docs.workspace_key" = "gc.docs.workspace,gc.var.docs_workspace", "gc.docs.workspace_path_key" = "gc.docs.workspace_path,gc.var.docs_workspace_path", "gc.docs.manifest_path_keys" = "gc.docs.manifest_path,gc.var.manifest_path", "gc.docs.source_change_id_key" = "gc.docs.source_change_id,gc.var.source_change_id" }
description_file = "../assets/workflows/jj-docs/describe-jj-change.md"

[[steps]]
id = "write-report"
title = "Write jj gap-analysis report"
needs = ["validate-context", "describe-gap-analysis-change"]
metadata = { "gc.run_target" = "gc.gap-analyst", "gc.build.artifact_schema" = "gc.build.gap-analysis.v1", "gc.build.artifact_path_keys" = "gc.build.gap_analysis_report_path,gc.var.report_path,gc.docs.gap_analysis.path", "gc.docs.managed" = "true", "gc.docs.document" = "gap-analysis", "gc.docs.document_schema" = "gc.build.gap-analysis.v1", "gc.docs.document_path_keys" = "gc.docs.gap_analysis.path,gc.build.gap_analysis_report_path,gc.var.report_path", "gc.docs.source_workspace_key" = "gc.docs.source_workspace,gc.var.source_workspace", "gc.docs.source_workspace_path_key" = "gc.docs.source_workspace_path,gc.var.source_workspace_path", "gc.docs.source_change_id_key" = "gc.docs.source_change_id,gc.var.source_change_id", "gc.docs.manifest_path_keys" = "gc.docs.manifest_path,gc.var.manifest_path" }
description_file = "../assets/workflows/jj-docs/gap-analysis-document.md"

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"
