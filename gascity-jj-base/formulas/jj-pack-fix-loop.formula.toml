description = """
Pack-aware JJ document-workspace implementation of the fix-loop-base
methodology contract.

Planning and review documents stay in default@ while source follow-up edits are
routed to packsmith with explicit pack metadata.
"""
formula = "jj-pack-fix-loop"
version = 1
contract = "graph.v2"
extends = ["jj-fix-loop"]
target_required = false
internal = true

[vars]
[vars.implementation_formula]
description = "Pack-aware JJ implementation formula used for fix work."
default = "jj-pack-implement"

[vars.code_review_formula]
description = "JJ review formula used after fixes."
default = "jj-review"

[vars.docs_workspace]
description = "JJ workspace name that owns workflow documents."
default = "default"

[vars.docs_workspace_path]
description = "Absolute path to the default@ checkout used for workflow documents."
default = ""

[vars.manifest_path]
description = "Path to the workflow document manifest."
default = ""

[vars.source_workspace]
description = "JJ workspace used for source implementation work."
default = ""

[vars.source_workspace_path]
description = "Absolute path to the jj source implementation workspace."
default = ""

[vars.source_change_id]
description = "JJ change ID containing the latest source implementation state."
default = ""

[vars.pack]
description = "Pack route key carried to packsmith child work."
required = true

[vars.pack_root]
description = "Pack directory relative to the rig root."
required = true

[vars.pack_workspace]
description = "Optional stable workspace key below the pack workspace."
default = ""

[vars.pack_route_target]
description = "Role target for routed packsmith work."
default = "packer.packsmith"

[vars.pack_route_formula]
description = "Formula used by routed packsmith work."
default = "mol-packer-work"

[[steps]]
id = "prepare-worktree"
title = "Prepare pack route metadata"
needs = ["plan-fixes"]
metadata = { "gc.run_target" = "gc.run-operator", "gc.formula" = "{{pack_route_formula}}", "gc.route_target" = "{{pack_route_target}}", "gc.pack" = "{{pack}}", "gc.pack_root" = "{{pack_root}}", "gc.pack_workspace" = "{{pack_workspace}}", "gc.docs.managed" = "true", "gc.docs.workspace_key" = "gc.docs.workspace,gc.var.docs_workspace", "gc.docs.workspace_path_key" = "gc.docs.workspace_path,gc.var.docs_workspace_path", "gc.docs.manifest_path_keys" = "gc.docs.manifest_path,gc.var.manifest_path", "gc.docs.source_workspace_key" = "gc.docs.source_workspace,gc.var.source_workspace", "gc.docs.source_workspace_path_key" = "gc.docs.source_workspace_path,gc.var.source_workspace_path", "gc.docs.source_change_id_key" = "gc.docs.source_change_id,gc.var.source_change_id" }
description_file = "../assets/workflows/jj-docs/prepare-pack-route.md"

[[steps]]
id = "describe-source-fix-change"
title = "Describe pack source fix request"
needs = ["plan-fixes", "prepare-worktree"]
metadata = { "gc.run_target" = "{{pack_route_target}}", "gc.formula" = "{{pack_route_formula}}", "gc.route_target" = "{{pack_route_target}}", "gc.pack" = "{{pack}}", "gc.pack_root" = "{{pack_root}}", "gc.pack_workspace" = "{{pack_workspace}}", "gc.jj.describe" = "true", "gc.jj.describe_scope" = "source", "gc.docs.managed" = "true", "gc.docs.manifest_path_keys" = "gc.docs.manifest_path,gc.var.manifest_path", "gc.docs.source_workspace_key" = "gc.docs.source_workspace,gc.var.source_workspace", "gc.docs.source_workspace_path_key" = "gc.docs.source_workspace_path,gc.var.source_workspace_path", "gc.docs.source_change_id_key" = "gc.docs.source_change_id,gc.var.source_change_id" }
description_file = "../assets/workflows/jj-docs/describe-jj-change.md"

[[steps]]
id = "apply-fixes"
title = "Apply pack review fixes"
needs = ["plan-fixes", "prepare-worktree", "describe-source-fix-change"]
metadata = { "gc.run_target" = "{{pack_route_target}}", "gc.formula" = "{{pack_route_formula}}", "gc.route_target" = "{{pack_route_target}}", "gc.pack" = "{{pack}}", "gc.pack_root" = "{{pack_root}}", "gc.pack_workspace" = "{{pack_workspace}}", "gc.build.artifact_schema" = "gc.build.implementation-summary.v1", "gc.build.artifact_path_keys" = "gc.implementation.summary_path,gc.build.implementation_summary_path,gc.var.summary_path,gc.docs.implementation_summary.path", "gc.docs.managed" = "true", "gc.docs.document" = "implementation-summary", "gc.docs.document_schema" = "gc.build.implementation-summary.v1", "gc.docs.document_path_keys" = "gc.docs.implementation_summary.path,gc.implementation.summary_path,gc.build.implementation_summary_path,gc.var.summary_path", "gc.docs.source_workspace_key" = "gc.docs.source_workspace,gc.var.source_workspace", "gc.docs.source_workspace_path_key" = "gc.docs.source_workspace_path,gc.var.source_workspace_path", "gc.docs.source_change_id_key" = "gc.docs.source_change_id,gc.var.source_change_id", "gc.docs.manifest_path_keys" = "gc.docs.manifest_path,gc.var.manifest_path" }
description_file = "../assets/workflows/jj-docs/pack-implementation-item.md"
