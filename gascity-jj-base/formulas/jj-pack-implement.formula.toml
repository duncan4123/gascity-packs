description = """
Pack-aware JJ implementation entry formula.

This formula inherits the default@ document summary and publish lifecycle from
`jj-implement` while routing implementation items to packsmith via explicit
pack metadata.
"""
formula = "jj-pack-implement"
version = 1
contract = "graph.v2"
extends = ["jj-implement"]
target_required = true
internal = true

[vars]
[vars.docs_workspace]
description = "JJ workspace name that owns workflow documents."
default = "default"

[vars.docs_workspace_path]
description = "Absolute path to the default@ checkout used for workflow documents."
default = ""

[vars.docs_base_revset]
description = "Revset used to resolve the document checkout."
default = "default@"

[vars.docs_artifact_root]
description = "Artifact root inside the default@ checkout."
default = ""

[vars.manifest_path]
description = "Path to the workflow document manifest."
default = ""

[vars.source_workspace]
description = "JJ workspace used for source implementation work."
default = ""

[vars.source_workspace_path]
description = "Absolute path to the jj source implementation workspace."
default = ""

[vars.source_change_id]
description = "JJ change ID containing the latest source implementation state."
default = ""

[vars.pack]
description = "Pack route key carried to packsmith child work."
required = true

[vars.pack_root]
description = "Pack directory relative to the rig root."
required = true

[vars.pack_workspace]
description = "Optional stable workspace key below the pack workspace."
default = ""

[vars.pack_route_target]
description = "Role target for routed packsmith work."
default = "packer.packsmith"

[vars.pack_route_formula]
description = "Formula used by routed packsmith work."
default = "mol-packer-work"

[[steps]]
id = "drain-separate"
title = "Route jj pack work in separate packsmith sessions"
needs = ["prepare"]
condition = "{{drain_policy}} == separate"
metadata = { "gc.run_target" = "{{pack_route_target}}", "gc.formula" = "{{pack_route_formula}}", "gc.route_target" = "{{pack_route_target}}", "gc.pack" = "{{pack}}", "gc.pack_root" = "{{pack_root}}", "gc.pack_workspace" = "{{pack_workspace}}", "gc.docs.managed" = "true", "gc.docs.manifest_path_keys" = "gc.docs.manifest_path,gc.var.manifest_path", "gc.docs.source_workspace_key" = "gc.docs.source_workspace,gc.var.source_workspace", "gc.docs.source_workspace_path_key" = "gc.docs.source_workspace_path,gc.var.source_workspace_path", "gc.docs.source_change_id_key" = "gc.docs.source_change_id,gc.var.source_change_id" }
description_file = "../assets/workflows/jj-docs/drain-pack.md"

[steps.drain]
context = "separate"
formula = "{{pack_route_formula}}"
member_access = "exclusive"

[[steps]]
id = "drain-same-session"
title = "Route jj pack work through a shared packsmith lane"
needs = ["prepare"]
condition = "{{drain_policy}} == same-session"
metadata = { "gc.run_target" = "{{pack_route_target}}", "gc.formula" = "{{pack_route_formula}}", "gc.route_target" = "{{pack_route_target}}", "gc.pack" = "{{pack}}", "gc.pack_root" = "{{pack_root}}", "gc.pack_workspace" = "{{pack_workspace}}", "gc.docs.managed" = "true", "gc.docs.manifest_path_keys" = "gc.docs.manifest_path,gc.var.manifest_path", "gc.docs.source_workspace_key" = "gc.docs.source_workspace,gc.var.source_workspace", "gc.docs.source_workspace_path_key" = "gc.docs.source_workspace_path,gc.var.source_workspace_path", "gc.docs.source_change_id_key" = "gc.docs.source_change_id,gc.var.source_change_id" }
description_file = "../assets/workflows/jj-docs/drain-pack.md"

[steps.drain]
context = "shared"
formula = "{{pack_route_formula}}"
on_item_failure = "skip_remaining"
member_access = "exclusive"

[steps.drain.item]
single_lane = true
