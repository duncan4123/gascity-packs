description = """
Pack-aware JJ document-workspace implementation of the Gas City build-base
contract.

This entry point inherits the jj-managed document lifecycle from `jj-build` and
overrides only source implementation drains. Pack source work is routed to the
imported packer pack so child beads carry explicit `gc.pack`, `gc.pack_root`,
and optional `gc.pack_workspace` metadata into packsmith sparse workspaces.
"""
formula = "jj-pack-build"
version = 1
contract = "graph.v2"
extends = ["jj-build"]
target_required = true

[catalog]
name = "jj-pack-build"
description = "Run jj-build with pack-aware source implementation routed through packsmith."

[metadata.gc.methodology]
allowed_drain_policies = ["separate", "same-session"]
implementation_strategy = "pack-drain"
interaction_modes = ["interactive", "autonomous", "headless"]
review_modes = ["report", "agent", "interactive"]

[vars]
[vars.implementation_formula]
description = "Pack-aware JJ implementation entry formula."
default = "jj-pack-implement"

[vars.review_fix_formula]
description = "Pack-aware JJ review-fix methodology formula."
default = "jj-pack-fix-loop"

[vars.docs_workspace]
description = "JJ workspace name that owns workflow documents."
default = "default"

[vars.docs_workspace_path]
description = "Absolute path to the default@ checkout used for workflow documents."
default = ""

[vars.docs_base_revset]
description = "Revset used to resolve the document checkout."
default = "default@"

[vars.docs_artifact_root]
description = "Artifact root inside the default@ checkout."
default = ""

[vars.manifest_path]
description = "Path to the workflow document manifest."
default = ""

[vars.source_workspace]
description = "JJ workspace used for source implementation work."
default = ""

[vars.source_workspace_path]
description = "Absolute path to the jj source implementation workspace."
default = ""

[vars.source_change_id]
description = "JJ change ID containing the latest source implementation state."
default = ""

[vars.pack]
description = "Pack route key carried to packsmith child work."
required = true

[vars.pack_root]
description = "Pack directory relative to the rig root."
required = true

[vars.pack_workspace]
description = "Optional stable workspace key below the pack workspace."
default = ""

[vars.pack_route_target]
description = "Role target for routed packsmith work."
default = "packer.packsmith"

[vars.pack_route_formula]
description = "Formula used by routed packsmith work."
default = "mol-packer-work"

[vars.packer_mode]
description = "Packer mode. Exact values: off, self-review, handoff, self-review-handoff."
default = "off"

[vars.findings_path]
description = "Path where the pack-improvement findings JSON is written or read."
default = ""

[vars.self_pack]
description = "Default pack for concrete improvements found while this pack workflow runs in self-review mode."
default = "gascity-jj-base"

[vars.self_pack_root]
description = "Default pack root for concrete improvements found while this pack workflow runs in self-review mode."
default = "gascity-jj-base"

[vars.self_pack_workspace]
description = "Optional stable workspace key for routed self-pack improvement work."
default = ""

[[steps]]
id = "implement"
title = "Route pack implementation convoy to separate packsmith sessions"
needs = ["decompose"]
condition = "{{drain_policy}} == separate"
metadata = { "gc.run_target" = "{{pack_route_target}}", "gc.formula" = "{{pack_route_formula}}", "gc.route_target" = "{{pack_route_target}}", "gc.pack" = "{{pack}}", "gc.pack_root" = "{{pack_root}}", "gc.pack_workspace" = "{{pack_workspace}}", "gc.docs.managed" = "true", "gc.docs.manifest_path_keys" = "gc.docs.manifest_path,gc.var.manifest_path", "gc.docs.source_workspace_key" = "gc.docs.source_workspace,gc.var.source_workspace", "gc.docs.source_workspace_path_key" = "gc.docs.source_workspace_path,gc.var.source_workspace_path", "gc.docs.source_change_id_key" = "gc.docs.source_change_id,gc.var.source_change_id" }
description_file = "../assets/workflows/jj-docs/drain-pack.md"

[steps.drain]
context = "separate"
formula = "{{pack_route_formula}}"
member_access = "exclusive"

[[steps]]
id = "implement-same-session"
title = "Route pack implementation convoy through a shared packsmith lane"
needs = ["decompose"]
condition = "{{drain_policy}} == same-session"
metadata = { "gc.run_target" = "{{pack_route_target}}", "gc.formula" = "{{pack_route_formula}}", "gc.route_target" = "{{pack_route_target}}", "gc.pack" = "{{pack}}", "gc.pack_root" = "{{pack_root}}", "gc.pack_workspace" = "{{pack_workspace}}", "gc.docs.managed" = "true", "gc.docs.manifest_path_keys" = "gc.docs.manifest_path,gc.var.manifest_path", "gc.docs.source_workspace_key" = "gc.docs.source_workspace,gc.var.source_workspace", "gc.docs.source_workspace_path_key" = "gc.docs.source_workspace_path,gc.var.source_workspace_path", "gc.docs.source_change_id_key" = "gc.docs.source_change_id,gc.var.source_change_id" }
description_file = "../assets/workflows/jj-docs/drain-pack.md"

[steps.drain]
context = "shared"
formula = "{{pack_route_formula}}"
on_item_failure = "skip_remaining"
member_access = "exclusive"

[steps.drain.item]
single_lane = true

[[steps]]
id = "pack-self-review"
title = "Review pack workflow friction"
needs = ["review"]
condition = "{{packer_mode}} == self-review"
metadata = { "gc.run_target" = "gc.run-operator", "gc.packer.mode" = "{{packer_mode}}", "gc.packer.self_pack" = "{{self_pack}}", "gc.packer.self_pack_root" = "{{self_pack_root}}", "gc.packer.self_pack_workspace" = "{{self_pack_workspace}}", "gc.build.artifact_schema" = "gc.packer.pack-improvement-findings.v1", "gc.build.artifact_path_keys" = "gc.packer.findings_path,gc.var.findings_path", "gc.packer.findings_schema" = "gc.packer.pack-improvement-findings.v1", "gc.packer.finding_schema" = "gc.packer.pack-improvement-finding.v1", "gc.packer.mode_key" = "gc.packer.mode,gc.var.packer_mode", "gc.packer.findings_path_key" = "gc.packer.findings_path,gc.var.findings_path", "gc.docs.managed" = "true", "gc.docs.manifest_path_keys" = "gc.docs.manifest_path,gc.var.manifest_path", "gc.docs.source_workspace_key" = "gc.docs.source_workspace,gc.var.source_workspace", "gc.docs.source_workspace_path_key" = "gc.docs.source_workspace_path,gc.var.source_workspace_path", "gc.docs.source_change_id_key" = "gc.docs.source_change_id,gc.var.source_change_id" }
description_file = "../assets/workflows/jj-docs/pack-self-review.md"

[[steps]]
id = "pack-self-review-handoff"
title = "Review pack workflow friction for handoff"
needs = ["review"]
condition = "{{packer_mode}} == self-review-handoff"
metadata = { "gc.run_target" = "gc.run-operator", "gc.packer.mode" = "{{packer_mode}}", "gc.packer.self_pack" = "{{self_pack}}", "gc.packer.self_pack_root" = "{{self_pack_root}}", "gc.packer.self_pack_workspace" = "{{self_pack_workspace}}", "gc.build.artifact_schema" = "gc.packer.pack-improvement-findings.v1", "gc.build.artifact_path_keys" = "gc.packer.findings_path,gc.var.findings_path", "gc.packer.findings_schema" = "gc.packer.pack-improvement-findings.v1", "gc.packer.finding_schema" = "gc.packer.pack-improvement-finding.v1", "gc.packer.mode_key" = "gc.packer.mode,gc.var.packer_mode", "gc.packer.findings_path_key" = "gc.packer.findings_path,gc.var.findings_path", "gc.docs.managed" = "true", "gc.docs.manifest_path_keys" = "gc.docs.manifest_path,gc.var.manifest_path", "gc.docs.source_workspace_key" = "gc.docs.source_workspace,gc.var.source_workspace", "gc.docs.source_workspace_path_key" = "gc.docs.source_workspace_path,gc.var.source_workspace_path", "gc.docs.source_change_id_key" = "gc.docs.source_change_id,gc.var.source_change_id" }
description_file = "../assets/workflows/jj-docs/pack-self-review.md"

[[steps]]
id = "route-pack-improvement"
title = "Route concrete pack-improvement findings"
needs = ["pack-self-review-handoff"]
condition = "{{packer_mode}} == self-review-handoff"
metadata = { "gc.run_target" = "gc.run-operator", "gc.packer.mode" = "{{packer_mode}}", "gc.packer.handoff" = "pack-improvement", "gc.packer.handoff_child_formula" = "mol-packer-work", "gc.packer.child_metadata_keys" = "gc.pack,gc.pack_root,gc.formula,gc.route_target", "gc.packer.optional_child_metadata_keys" = "gc.pack_workspace,gc.packer.finding_id,gc.packer.findings_path,gc.packer.finding_schema,gc.packer.mode", "gc.packer.findings_schema" = "gc.packer.pack-improvement-findings.v1", "gc.packer.finding_schema" = "gc.packer.pack-improvement-finding.v1", "gc.packer.findings_path_key" = "gc.packer.findings_path,gc.var.findings_path", "gc.docs.managed" = "true", "gc.docs.manifest_path_keys" = "gc.docs.manifest_path,gc.var.manifest_path" }
description_file = "../assets/workflows/jj-docs/pack-self-review.md"

[[steps]]
id = "handoff-pack-improvement"
title = "Route existing pack-improvement findings"
needs = ["review"]
condition = "{{packer_mode}} == handoff"
metadata = { "gc.run_target" = "gc.run-operator", "gc.packer.mode" = "{{packer_mode}}", "gc.packer.handoff" = "pack-improvement", "gc.packer.handoff_child_formula" = "mol-packer-work", "gc.packer.child_metadata_keys" = "gc.pack,gc.pack_root,gc.formula,gc.route_target", "gc.packer.optional_child_metadata_keys" = "gc.pack_workspace,gc.packer.finding_id,gc.packer.findings_path,gc.packer.finding_schema,gc.packer.mode", "gc.packer.findings_schema" = "gc.packer.pack-improvement-findings.v1", "gc.packer.finding_schema" = "gc.packer.pack-improvement-finding.v1", "gc.packer.findings_path_key" = "gc.packer.findings_path,gc.var.findings_path", "gc.docs.managed" = "true", "gc.docs.manifest_path_keys" = "gc.docs.manifest_path,gc.var.manifest_path" }
description_file = "../assets/workflows/jj-docs/pack-self-review.md"
