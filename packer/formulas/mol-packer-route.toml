description = """
Route broad pack-maintenance work into pack-scoped jj workspaces.

Use this formula from a rig-root router session. The router inspects the request
with the full packs repository visible, identifies target packs, creates one
child bead per target pack, and dispatches those beads to the shared packsmith
pool. Each packsmith session uses bead metadata to create a sparse jj workspace
for the requested pack.
"""
formula = "mol-packer-route"
version = 1

[[steps]]
id = "load-request"
title = "Load request from rig root"
description = """
Run `gc hook`, read the assigned bead, and inspect the pack repository from the
rig root.

```bash
gc hook
pwd
jj status
```

Exit criteria:

- the request is understood
- the target pack or packs are explicit
- shared registry/test/doc surfaces are identified
"""

[[steps]]
id = "plan-pack-routes"
title = "Plan pack routes"
needs = ["load-request"]
description = """
For each target pack, decide the pack route and pack root. In `gascity-packs`,
the usual route for `jj-hunk` is:

```text
gc.pack=jj-hunk
gc.pack_root=jj-hunk
```

All normal pack implementation beads route to the shared `packer.packsmith`
agent. Do not require one packsmith agent per pack.

Exit criteria:

- every target pack has `gc.pack` and `gc.pack_root` values
- route target is the shared packsmith pool
- any ambiguous pack target is reported clearly
"""

[[steps]]
id = "create-pack-beads"
title = "Create pack-scoped beads"
needs = ["plan-pack-routes"]
description = """
Create one child bead per target pack. Each child bead should include:

- target pack name
- resolved pack root if it differs from the pack name
- formula `mol-packer-work`
- acceptance criteria
- verification command, usually `gc lint <pack>`
- dependencies on other child beads when order matters

Use metadata or notes to preserve the route decision. For a new workspace, set
the pack fields and omit `gc.pack_workspace`:

```text
gc.pack=<pack>
gc.pack_root=<pack-root>
```

GC will derive the concrete workspace from the child bead id and title under:

```text
.gc/workspaces/<rig>/packs/<pack>/<bead-id>-<title-slug>
```

For follow-up work that must reuse an existing workspace, also set:

```text
gc.pack_workspace=<workspace-name>
```

`gc.pack_workspace` is a workspace key under the pack directory. It is not a
path and must not contain slashes.

Prefer the packer helper so the child bead and sling route stay consistent:

```bash
packer/assets/scripts/create-pack-bead.sh \
  --parent <parent-bead-id> \
  --pack <pack-name> \
  --pack-root <pack-root> \
  --title "<pack-name>: <specific implementation task>" \
  --description "<task details>" \
  --acceptance "gc lint <pack-name> passes"
```

To reuse an existing workspace, add:

```bash
--workspace <workspace-name>
```

The helper writes `gc.pack`, `gc.pack_root`, `gc.formula=mol-packer-work`, and
`gc.route_target` metadata before dispatch. It also writes `gc.pack_workspace`
when `--workspace` is provided.

Exit criteria:

- child beads are claim-sized
- target pack is visible in each bead
- new workspace beads omit `gc.pack_workspace`
- existing workspace beads set `gc.pack_workspace`
- dependencies encode only real ordering constraints
"""

[[steps]]
id = "dispatch-pack-beads"
title = "Dispatch pack beads"
needs = ["create-pack-beads"]
description = """
Dispatch each child bead to the shared packsmith pool and formula.

Typical shape:

```bash
gc sling <rig>/packer.packsmith <child-bead-id> --on mol-packer-work
```

The child bead must carry `gc.pack` and `gc.pack_root` metadata so packsmith's
pre-start hook can sparse-checkout the correct pack before the bead is claimed.
If `gc.pack_workspace` is set, packsmith reuses that workspace under the pack;
otherwise GC creates a new workspace from the child bead id and title. Do not
dispatch a bead whose target pack is ambiguous.

Exit criteria:

- every child bead is routed to `packer.packsmith`
- the parent bead notes list child beads and targets
- any unrouted pack is explicitly recorded
"""
