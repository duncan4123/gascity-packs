scope = "rig"
provider = "codex"
wake_mode = "fresh"
formula = "mol-packer-work"
# Shared packsmith is a neutral pool template. Routed beads select the actual
# pack with gc.pack/gc.pack_root metadata before pre_start runs.
work_dir = ".gc/workspaces/{{.Rig}}/packs/__packsmith__"
nudge = "Check jj log & list packs"
pre_start = [
  "\"$GC_RIG_ROOT/packer/assets/scripts/pack-workspace-setup.sh\" --sync",
]
idle_timeout = "2h"
min_active_sessions = 0
max_active_sessions = 6
