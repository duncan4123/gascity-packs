[pack]
name = "megamerge-workflow"
version = "0.1.0"
schema = 2
description = "Jujutsu megamerge workflow for repairing several related lines together."

[imports.jj-hunk]
source = "../jj-hunk"

[providers.omp-megamerge]
display_name = "Oh My Pi Megamerge"
command = "/home/ubuntu/.bun/bin/omp"
prompt_mode = "arg"
ready_delay_ms = 1000
path_check = "/home/ubuntu/.bun/bin/omp"
